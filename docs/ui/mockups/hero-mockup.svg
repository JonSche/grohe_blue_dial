<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GROHE Blue Dial hero product shot, mid-dispense">
<defs>
<style>text{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;}</style>
<radialGradient id="heroBg" cx="0.5" cy="0.32" r="0.9">
<stop offset="0" stop-color="#1b2128"/>
<stop offset="0.55" stop-color="#12161b"/>
<stop offset="1" stop-color="#08090b"/>
</radialGradient>
<linearGradient id="heroCounter" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a2f35"/>
<stop offset="1" stop-color="#14171a"/>
</linearGradient>
<linearGradient id="heroBezel" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#6b7078"/><stop offset="0.28" stop-color="#e2e6ea"/>
<stop offset="0.5" stop-color="#9aa0a8"/><stop offset="0.75" stop-color="#c7ccd1"/>
<stop offset="1" stop-color="#3e4348"/>
</linearGradient>
<radialGradient id="heroGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#35a7e0" stop-opacity="0.28"/>
<stop offset="1" stop-color="#35a7e0" stop-opacity="0"/>
</radialGradient>
<filter id="heroBlur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="10"/>
</filter>
</defs>

<rect width="640" height="760" fill="url(#heroBg)"/>
<rect x="0" y="560" width="640" height="200" fill="url(#heroCounter)"/>
<rect x="0" y="558" width="640" height="3" fill="#3a4048" opacity="0.6"/>

<circle cx="320" cy="330" r="230" fill="url(#heroGlow)" filter="url(#heroBlur)"/>

<!-- dial body -->
<circle cx="320" cy="330" r="176" fill="#1c2024"/>
<circle cx="320" cy="330" r="172" fill="none" stroke="url(#heroBezel)" stroke-width="9"/>
<circle cx="320" cy="330" r="158" fill="#101418"/>
<ellipse cx="278" cy="270" rx="70" ry="34" fill="#ffffff" opacity="0.05" filter="url(#heroBlur)"/>

<circle cx="320" cy="330" r="148" fill="none" stroke="#2a3038" stroke-width="15"/>
<circle cx="320" cy="330" r="148" fill="none" stroke="#35a7e0" stroke-width="15" stroke-linecap="round"
  stroke-dasharray="195.77 734.14" transform="rotate(-90 320 330)"/>
<circle cx="320" cy="330" r="148" fill="none" stroke="#7fd0f2" stroke-width="15" stroke-linecap="round"
  stroke-dasharray="25.83 904.08" transform="rotate(-30 320 330)"/>

<circle cx="303" cy="248" r="6" fill="#35a7e0"/>
<circle cx="335" cy="248" r="6.5" fill="#35a7e0"/>

<text x="320" y="341" text-anchor="middle"><tspan font-size="66" font-weight="600" fill="#f4f6f8">280</tspan><tspan font-size="19" fill="#93a0ac" dx="6">ml</tspan></text>
<text x="320" y="384" text-anchor="middle" font-size="14" letter-spacing="3" fill="#93a0ac" fill-opacity="0.55">SPARKLING</text>
<text x="320" y="422" text-anchor="middle" font-size="17" fill="#f4f6f8">PRESS TO STOP</text>

<!-- caption plate -->
<text x="320" y="640" text-anchor="middle" font-size="30" font-weight="300" letter-spacing="8" fill="#f4f6f8">GROHE BLUE</text>
<text x="320" y="672" text-anchor="middle" font-size="14" letter-spacing="2" fill="#8a93a6">WATER, CONSIDERED.</text>
</svg>
